<!doctype html><html><meta charset="utf-8"><title>World UI fixtures</title><h1>World UI scenarios (isolated test origin only)</h1><button id="flood">Flood and damaged camp</button><button id="treefall">Fallen tree</button><script src="../src/data.js"></script><script src="../src/world.js"></script><script src="../src/engine.js"></script><script>
function start(type){if(location.port!=='8944')throw Error('Use isolated test server on port 8944');const s=Survival.newGame('survivor',42);s.day=type==='flood'?4:5;s.location=type==='flood'?'river':'forest';s.visited.push(s.location);s.weather='storm';s.forecast='clear';s.world.hazards=WorldRules.hazardsFor(s,'storm',s.day);s.world.discovered.push(s.location);s.camps[s.location].structures=['shelter','firepit'];s.camps[s.location].condition=35;s.inv.wood=9;s.inv.fiber=10;s.inv.axe=1;s.tools.axe=24;s.inv.climbing_rope=1;localStorage.setItem('wildland_autosave_v2',JSON.stringify(s));location.href='../index.html';}
document.querySelector('#flood').onclick=()=>start('flood');document.querySelector('#treefall').onclick=()=>start('treefall');</script></html>
